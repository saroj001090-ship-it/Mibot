<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        /* Base Resets for Mobile-First App */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overscroll-behavior-y: none;
        }

        /* Fallback Loader Styles */
        #loading {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.25rem;
            font-family: system-ui, -apple-system, sans-serif;
            color: #374151;
            transition: opacity 0.3s ease;
        }
        html.dark #loading {
            background: #111827;
            color: #f3f4f6;
        }

        /* App Container setup */
        #app {
            display: none; /* Hidden until JS loads */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        html.dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Markdown Custom Styles */
        .markdown-body {
            font-family: inherit;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .markdown-body p { margin-bottom: 0.75em; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
        }
        html.dark .markdown-body pre { background-color: #0f172a; border: 1px solid #1e293b; }
        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.875em;
        }
        .markdown-body :not(pre) > code {
            background-color: rgba(148, 163, 184, 0.2);
            padding: 0.15rem 0.3rem;
            border-radius: 0.25rem;
        }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body a { color: #3b82f6; text-decoration: underline; }

        /* Typing Animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-200">

    <div id="loading">
        <div class="flex flex-col items-center gap-4">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
            <div>Loading App...</div>
        </div>
    </div>

    <div id="app" class="flex min-h-[100dvh] w-full relative">
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-gray-50 dark:bg-gray-850 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 flex flex-col h-[100dvh]">
            <div class="p-4 flex items-center justify-between">
                <button id="btn-new-chat" class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors shadow-sm text-sm font-medium">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
                <button id="btn-close-sidebar" class="md:hidden ml-2 p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <button id="btn-theme" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-moon w-5 text-center" id="theme-icon"></i>
                    <span id="theme-text">Dark Mode</span>
                </button>
                <button id="btn-settings" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-gear w-5 text-center"></i>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 h-[100dvh] relative bg-white dark:bg-gray-900">
            <header class="flex items-center justify-between p-4 sticky top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-10 border-b border-transparent">
                <div class="flex items-center gap-3">
                    <button id="btn-menu" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 bg-clip-text text-transparent">Universal AI</h1>
                </div>
                <div class="text-xs font-medium px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded-md text-gray-500" id="current-model-display">
                    deepseek-r1:free
                </div>
            </header>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6 pb-40 scroll-smooth">
                </div>

            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent dark:from-gray-900 dark:via-gray-900 pt-8 pb-4 px-4 md:px-8 z-20">
                <div class="max-w-4xl mx-auto relative">
                    <form id="chat-form" class="relative flex items-end gap-2 bg-gray-50 dark:bg-gray-850 rounded-[1.5rem] p-2 border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:border-blue-500/50 shadow-sm transition-all">
                        <textarea id="message-input" rows="1" class="w-full max-h-48 resize-none bg-transparent border-none outline-none py-3 px-4 text-gray-800 dark:text-gray-100 placeholder-gray-500" placeholder="Message AI..."></textarea>
                        <button type="submit" id="btn-send" class="p-3 m-1 rounded-full bg-blue-600 text-white hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0 flex items-center justify-center w-12 h-12 shadow-md">
                            <i class="fa-solid fa-arrow-up text-lg"></i>
                        </button>
                    </form>
                    <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500 px-4">
                        AI can make mistakes. Verify critical information.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-settings" class="fixed inset-0 z-[100] hidden items-center justify-center">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="modal-backdrop"></div>
        <div class="relative bg-white dark:bg-gray-850 rounded-2xl shadow-2xl w-11/12 max-w-lg p-6 border border-gray-200 dark:border-gray-700 flex flex-col gap-5 transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-3">
                <h2 class="text-xl font-semibold">Settings</h2>
                <button id="btn-close-modal-x" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="input-api-key" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" placeholder="sk-or-v1-...">
                    <p class="text-xs text-gray-500 mt-1">Stored locally in your browser.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Model Name</label>
                    <input type="text" id="input-model" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" value="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Global System Prompt</label>
                    <textarea id="input-system" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none h-24 transition-shadow" placeholder="You are a helpful, brilliant AI assistant..."></textarea>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
                <button id="btn-close-settings" class="px-5 py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 font-medium text-gray-700 dark:text-gray-300 transition-colors">Cancel</button>
                <button id="btn-save-settings" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium shadow-md transition-colors">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- DEPENDENCY CONFIGURATION ---
            marked.setOptions({ breaks: true, gfm: true });

            // --- STATE MANAGEMENT ---
            const defaultSettings = {
                apiKey: '',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: 'You are a helpful, smart, and concise AI assistant.',
                theme: 'light'
            };

            let settings = { ...defaultSettings };
            let chats = [];
            let currentChatId = null;
            let isGenerating = false;

            // --- DOM ELEMENTS ---
            const els = {
                app: document.getElementById('app'),
                loading: document.getElementById('loading'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                chatList: document.getElementById('chat-list'),
                messagesContainer: document.getElementById('messages-container'),
                chatForm: document.getElementById('chat-form'),
                messageInput: document.getElementById('message-input'),
                btnSend: document.getElementById('btn-send'),
                btnNewChat: document.getElementById('btn-new-chat'),
                btnMenu: document.getElementById('btn-menu'),
                btnCloseSidebar: document.getElementById('btn-close-sidebar'),
                btnTheme: document.getElementById('btn-theme'),
                themeIcon: document.getElementById('theme-icon'),
                themeText: document.getElementById('theme-text'),
                btnSettings: document.getElementById('btn-settings'),
                modalSettings: document.getElementById('modal-settings'),
                modalContent: document.getElementById('modal-content'),
                modalBackdrop: document.getElementById('modal-backdrop'),
                btnCloseSettings: document.getElementById('btn-close-settings'),
                btnCloseModalX: document.getElementById('btn-close-modal-x'),
                btnSaveSettings: document.getElementById('btn-save-settings'),
                inputApiKey: document.getElementById('input-api-key'),
                inputModel: document.getElementById('input-model'),
                inputSystem: document.getElementById('input-system'),
                currentModelDisplay: document.getElementById('current-model-display')
            };

            // --- INITIALIZATION ---
            function init() {
                loadData();
                applyTheme(settings.theme);
                renderSidebar();
                
                if (chats.length > 0) {
                    selectChat(chats[0].id);
                } else {
                    renderMessages(); // Shows welcome screen
                }

                setupEventListeners();

                // Hide loader and show app safely
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    els.app.style.display = 'flex';
                }, 300);
            }

            // --- LOCAL STORAGE ---
            function loadData() {
                try {
                    const savedSettings = localStorage.getItem('ai_settings');
                    if (savedSettings) settings = { ...settings, ...JSON.parse(savedSettings) };
                    
                    const savedChats = localStorage.getItem('ai_chats');
                    if (savedChats) chats = JSON.parse(savedChats);
                } catch (e) {
                    console.error("Error loading data", e);
                }
                els.currentModelDisplay.innerText = settings.model.split('/').pop();
            }

            function saveData() {
                try {
                    localStorage.setItem('ai_settings', JSON.stringify(settings));
                    localStorage.setItem('ai_chats', JSON.stringify(chats));
                } catch (e) {
                    console.error("Error saving data", e);
                }
            }

            // --- THEME MANAGEMENT ---
            function applyTheme(theme) {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    els.themeIcon.classList.replace('fa-moon', 'fa-sun');
                    els.themeText.innerText = 'Light Mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    els.themeIcon.classList.replace('fa-sun', 'fa-moon');
                    els.themeText.innerText = 'Dark Mode';
                }
            }

            function toggleTheme() {
                settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
                applyTheme(settings.theme);
                saveData();
            }

            // --- UI RENDERING ---
            function renderSidebar() {
                els.chatList.innerHTML = '';
                chats.forEach(chat => {
                    const isActive = chat.id === currentChatId;
                    const div = document.createElement('div');
                    div.className = `group relative flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl cursor-pointer text-sm font-medium transition-colors ${
                        isActive 
                        ? 'bg-blue-100 dark:bg-gray-800 text-blue-700 dark:text-blue-400' 
                        : 'hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'
                    }`;
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'flex-1 truncate';
                    titleSpan.textContent = chat.title || 'New Chat';
                    div.onclick = () => selectChat(chat.id);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = `flex items-center opacity-0 group-hover:opacity-100 transition-opacity ${isActive ? 'opacity-100' : ''}`;
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'p-1.5 hover:text-blue-500 transition-colors';
                    editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
                    editBtn.onclick = (e) => { e.stopPropagation(); renameChat(chat.id); };

                    const delBtn = document.createElement('button');
                    delBtn.className = 'p-1.5 hover:text-red-500 transition-colors ml-1';
                    delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };

                    actionsDiv.appendChild(editBtn);
                    actionsDiv.appendChild(delBtn);

                    div.appendChild(titleSpan);
                    div.appendChild(actionsDiv);
                    els.chatList.appendChild(div);
                });
            }

            function renderMessages() {
                els.messagesContainer.innerHTML = '';
                const activeChat = chats.find(c => c.id === currentChatId);

                if (!activeChat || activeChat.messages.length === 0) {
                    els.messagesContainer.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center space-y-6 mt-10 md:mt-24 max-w-2xl mx-auto px-4">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20 transform hover:scale-105 transition-transform">
                                <i class="fa-solid fa-sparkles text-white text-2xl"></i>
                            </div>
                            <h2 class="text-3xl font-semibold bg-gradient-to-r from-gray-800 to-gray-500 dark:from-gray-100 dark:to-gray-400 bg-clip-text text-transparent">How can I help you today?</h2>
                            <p class="text-gray-500 dark:text-gray-400">Enter a message below to start chatting with ${settings.model.split('/').pop()}.</p>
                        </div>
                    `;
                    return;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'max-w-3xl w-full mx-auto flex flex-col gap-6';

                activeChat.messages.forEach(msg => {
                    if (msg.role === 'system') return; // Hide system messages

                    const msgDiv = document.createElement('div');
                    if (msg.role === 'user') {
                        msgDiv.className = 'self-end bg-blue-100 dark:bg-blue-900/50 text-gray-900 dark:text-gray-100 px-5 py-3.5 rounded-3xl rounded-br-sm max-w-[85%] md:max-w-[75%] break-words shadow-sm';
                        msgDiv.textContent = msg.content;
                    } else {
                        msgDiv.className = 'self-start w-full flex gap-4 max-w-full';
                        msgDiv.innerHTML = `
                            <div class="w-8 h-8 flex-shrink-0 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center mt-1 shadow-sm">
                                <i class="fa-solid fa-sparkles text-white text-xs"></i>
                            </div>
                            <div class="flex-1 min-w-0 markdown-body text-gray-800 dark:text-gray-200 pt-1">
                                ${DOMPurify.sanitize(marked.parse(msg.content))}
                            </div>
                        `;
                    }
                    wrapper.appendChild(msgDiv);
                });
                
                els.messagesContainer.appendChild(wrapper);
                scrollToBottom();
            }

            function scrollToBottom() {
                els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
            }

            // --- CHAT MANAGEMENT ---
            function createNewChat() {
                if (isGenerating) return;
                const newChat = {
                    id: Date.now().toString(),
                    title: 'New Chat',
                    messages: [],
                    systemPrompt: settings.systemPrompt
                };
                chats.unshift(newChat);
                currentChatId = newChat.id;
                saveData();
                renderSidebar();
                renderMessages();
                closeSidebarMobile();
                els.messageInput.focus();
            }

            function selectChat(id) {
                if (isGenerating) return;
                currentChatId = id;
                renderSidebar();
                renderMessages();
                closeSidebarMobile();
            }

            function deleteChat(id) {
                if (isGenerating) return;
                if (!confirm("Are you sure you want to delete this chat?")) return;
                chats = chats.filter(c => c.id !== id);
                if (currentChatId === id) {
                    currentChatId = chats.length > 0 ? chats[0].id : null;
                }
                saveData();
                renderSidebar();
                renderMessages();
            }

            function renameChat(id) {
                const chat = chats.find(c => c.id === id);
                if (!chat) return;
                const newTitle = prompt("Enter new title:", chat.title);
                if (newTitle && newTitle.trim()) {
                    chat.title = newTitle.trim();
                    saveData();
                    renderSidebar();
                }
            }

            // --- MOBILE SIDEBAR ---
            function openSidebarMobile() {
                els.sidebar.classList.remove('-translate-x-full');
                els.sidebarOverlay.classList.remove('hidden');
            }

            function closeSidebarMobile() {
                els.sidebar.classList.add('-translate-x-full');
                els.sidebarOverlay.classList.add('hidden');
            }

            // --- MODAL SETTINGS ---
            function openSettings() {
                els.inputApiKey.value = settings.apiKey;
                els.inputModel.value = settings.model;
                els.inputSystem.value = settings.systemPrompt;
                els.modalSettings.classList.remove('hidden');
                els.modalSettings.classList.add('flex');
                setTimeout(() => els.modalContent.classList.replace('scale-95', 'scale-100'), 10);
            }

            function closeSettings() {
                els.modalContent.classList.replace('scale-100', 'scale-95');
                setTimeout(() => {
                    els.modalSettings.classList.add('hidden');
                    els.modalSettings.classList.remove('flex');
                }, 200);
            }

            function saveSettings() {
                settings.apiKey = els.inputApiKey.value.trim();
                settings.model = els.inputModel.value.trim() || 'deepseek/deepseek-r1:free';
                settings.systemPrompt = els.inputSystem.value.trim();
                els.currentModelDisplay.innerText = settings.model.split('/').pop();
                saveData();
                closeSettings();
            }

            // --- AUTO-RESIZE TEXTAREA ---
            function resizeTextarea() {
                els.messageInput.style.height = 'auto';
                els.messageInput.style.height = Math.min(els.messageInput.scrollHeight, 192) + 'px'; // 192px = max-h-48
            }

            // --- API INTEGRATION & STREAMING ---
            async function sendMessage(e) {
                if (e) e.preventDefault();
                if (isGenerating) return;

                const text = els.messageInput.value.trim();
                if (!text) return;

                if (!settings.apiKey) {
                    alert("Please set your OpenRouter API Key in Settings first.");
                    openSettings();
                    return;
                }

                // Create chat if none exists
                if (!currentChatId || chats.length === 0) {
                    createNewChat();
                }

                const chat = chats.find(c => c.id === currentChatId);
                if (!chat) return;

                // Auto-generate title for first message
                if (chat.messages.length === 0) {
                    chat.title = text.length > 30 ? text.substring(0, 30) + '...' : text;
                    renderSidebar();
                }

                // Add User Message
                chat.messages.push({ role: 'user', content: text });
                
                // Reset Input UI
                els.messageInput.value = '';
                els.messageInput.style.height = 'auto';
                els.btnSend.disabled = true;
                isGenerating = true;
                saveData();
                renderMessages();

                // Create placeholder for AI message
                const wrapper = els.messagesContainer.querySelector('.max-w-3xl') || document.createElement('div');
                if (!els.messagesContainer.contains(wrapper)) {
                    wrapper.className = 'max-w-3xl w-full mx-auto flex flex-col gap-6';
                    els.messagesContainer.innerHTML = '';
                    els.messagesContainer.appendChild(wrapper);
                }

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'self-start w-full flex gap-4 max-w-full';
                aiMsgDiv.innerHTML = `
                    <div class="w-8 h-8 flex-shrink-0 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center mt-1 shadow-sm">
                        <i class="fa-solid fa-sparkles text-white text-xs"></i>
                    </div>
                    <div class="flex-1 min-w-0 markdown-body text-gray-800 dark:text-gray-200 pt-1" id="stream-content">
                        <div class="typing-indicator mt-2"><span></span><span></span><span></span></div>
                    </div>
                `;
                wrapper.appendChild(aiMsgDiv);
                scrollToBottom();

                const streamContent = aiMsgDiv.querySelector('#stream-content');
                let aiResponseText = "";

                // Prepare Payload
                const payloadMessages = [];
                if (chat.systemPrompt) {
                    payloadMessages.push({ role: 'system', content: chat.systemPrompt });
                }
                payloadMessages.push(...chat.messages);

                try {
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`
                        },
                        body: JSON.stringify({
                            model: settings.model,
                            messages: payloadMessages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || `HTTP Error ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed === 'data: [DONE]') continue;
                            
                            if (trimmed.startsWith('data:')) {
                                try {
                                    const jsonStr = trimmed.slice(5).trim();
                                    const data = JSON.parse(jsonStr);
                                    if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                        aiResponseText += data.choices[0].delta.content;
                                        streamContent.innerHTML = DOMPurify.sanitize(marked.parse(aiResponseText));
                                        scrollToBottom();
                                    }
                                } catch (e) {
                                    // Soft fail for chunk parse errors
                                    console.warn("SSE Parse Error", e);
                                }
                            }
                        }
                    }

                } catch (error) {
                    aiResponseText = `**Error:** ${error.message}`;
                    streamContent.innerHTML = DOMPurify.sanitize(marked.parse(aiResponseText));
                    streamContent.classList.add('text-red-500');
                } finally {
                    chat.messages.push({ role: 'assistant', content: aiResponseText });
                    saveData();
                    isGenerating = false;
                    els.btnSend.disabled = false;
                    els.messageInput.focus();
                }
            }

            // --- EVENT LISTENERS ---
            function setupEventListeners() {
                els.btnTheme.addEventListener('click', toggleTheme);
                els.btnNewChat.addEventListener('click', createNewChat);
                els.btnMenu.addEventListener('click', openSidebarMobile);
                els.btnCloseSidebar.addEventListener('click', closeSidebarMobile);
                els.sidebarOverlay.addEventListener('click', closeSidebarMobile);
                
                // Settings Modal
                els.btnSettings.addEventListener('click', openSettings);
                els.btnCloseSettings.addEventListener('click', closeSettings);
                els.btnCloseModalX.addEventListener('click', closeSettings);
                els.modalBackdrop.addEventListener('click', closeSettings);
                els.btnSaveSettings.addEventListener('click', saveSettings);

                // Input handling
                els.messageInput.addEventListener('input', resizeTextarea);
                els.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
                els.chatForm.addEventListener('submit', sendMessage);
            }

            // START APP
            init();
        });
    </script>
</body>
</html>
